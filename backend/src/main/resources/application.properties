# ===================================================================
# Hospital Management System - Spring Boot Backend Configuration
# ===================================================================

server.port=${PORT:8080}

# MySQL Database Configuration (Railway Cloud MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://hayabusa.proxy.rlwy.net:40465/railway?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gZGpCIshoBVxfPzuThKBkqFClWNfNEWM}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true


# HikariCP Cloud Connection Pool Resilience
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:10}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JWT Configuration (256-bit+ key for HS256)
app.jwt.secret=${APP_JWT_SECRET:HospitalManagementSystemSuperSecretKeyWithAtLeast256BitsForHMACSHA256SignatureVerification2024}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Logging
logging.level.com.hospital.hms=INFO
logging.level.org.springframework.security=WARN
