<nav class="navbar navbar-expand-lg navbar-dark bg-dark-navy shadow-sm sticky-top">
  <div class="container-fluid px-3 px-md-4">
    <div class="d-flex align-items-center">
      <!-- Mobile Sidebar Toggle Button for Logged-In Users -->
      <button class="btn btn-nav-toggle text-white d-lg-none me-2 p-0 border-0" 
              type="button" 
              (click)="sidebarService.toggle()" 
              aria-label="Toggle navigation drawer"
              *ngIf="authService.isLoggedIn()">
        <i class="bi bi-list fs-2 lh-1"></i>
      </button>

      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" [routerLink]="authService.getDashboardRouteForUser()">
        <div class="brand-icon">
          <i class="bi bi-hospital"></i>
        </div>
        <span class="brand-text">MedPulse <span class="text-teal">HMS</span></span>
      </a>
    </div>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0" *ngIf="authService.isLoggedIn()">
        <li class="nav-item">
          <a class="nav-link" [routerLink]="authService.getDashboardRouteForUser()" routerLinkActive="active">
            <i class="bi bi-grid-1x2 me-1"></i> Dashboard
          </a>
        </li>
        <li class="nav-item" *ngIf="!authService.hasRole('ROLE_PATIENT')">
          <a class="nav-link" routerLink="/operations" routerLinkActive="active">
            <i class="bi bi-grid-fill me-1 text-danger"></i> Operations Hub
          </a>
        </li>
      </ul>

      <ul class="navbar-nav ms-auto align-items-center gap-2">
        <ng-container *ngIf="!authService.isLoggedIn()">
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </a>
          </li>
          <li class="nav-item">
            <a class="btn btn-teal text-white px-3" routerLink="/register">
              <i class="bi bi-person-plus me-1"></i> Register
            </a>
          </li>
        </ng-container>

        <ng-container *ngIf="authService.currentUser$ | async as user">
          <li class="nav-item d-flex align-items-center me-2 text-light">
            <div class="user-avatar me-2">
              <i class="bi bi-person-circle fs-4"></i>
            </div>
            <div class="d-none d-md-block text-start">
              <div class="fw-semibold text-white small">{{ user.firstName }} {{ user.lastName }}</div>
              <span class="badge" [ngClass]="roleBadgeClass">{{ displayRoleName }}</span>
            </div>
          </li>
          <li class="nav-item">
            <button class="btn btn-outline-light btn-sm px-3 rounded-pill" (click)="logout()">
              <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
          </li>
        </ng-container>
      </ul>
    </div>
  </div>
</nav>
